<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffe8f0" />
    <title>寻喵大作战</title>
    <style>
      /**
     * 设计变量：颜色与层级统一管理，避免魔法值散落。
     * z-index 约定：overlay(1) < hud/intro(2) < ui(3) < settings(5/6) < error(10)
     */
      :root {
        --c-bg-page: #1a1a24;
        --c-bg-canvas: #0a0a10;
        --c-primary: #e85d8a;
        --c-primary-light: #ff8fb3;
        --c-accent: #ed6f99;
        --c-ink: #0a0a0a;
        --c-text-on-dark: #fff;
        --c-ghost: rgba(255, 255, 255, 0.12);
        --z-base: 0;
        --z-overlay: 1;
        --z-hud: 2;
        --z-ui: 3;
        --z-settings: 5;
        --z-settings-panel: 6;
        --z-error: 10;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        background: var(--c-bg-page);
        touch-action: none;
      }
      .is-hidden {
        display: none;
      }
      #wrap {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        max-width: 100vw;
      }
      /**
     * 顶栏叠在游戏画面上方、不占 flex 高度；渐变到底透明，少「一大条黑边」
     * z-index:var(--z-hud) < #ui(3) 开找/通关全屏时不会被 HUD 压在上面
     */
      #hud {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: var(--z-hud);
        padding: max(2px, env(safe-area-inset-top, 0px)) 10px 12px;
        text-align: center;
        color: var(--c-text-on-dark);
        font-size: 14px;
        line-height: 1.35;
        text-shadow:
          0 1px 2px rgba(0, 0, 0, 0.65),
          0 0 20px rgba(0, 0, 0, 0.35);
        background: linear-gradient(
          180deg,
          rgba(8, 6, 14, 0.58) 0%,
          rgba(8, 6, 14, 0.28) 50%,
          rgba(8, 6, 14, 0) 100%
        );
        border: none;
        pointer-events: none;
      }
      #hud p {
        margin-bottom: 2px;
      }
      .hud-stats {
        font-size: 12px;
        opacity: 0.85;
      }
      /** 各次抓猫用时：无底色框，仅字 + 描影，与透明顶栏统一 */
      #hud .catch-time-hud {
        position: relative;
        z-index: var(--z-overlay);
        width: 100%;
        max-width: 100%;
        margin: 2px 0 0;
        padding: 0 4px 2px;
        box-sizing: border-box;
        text-align: center;
        font-size: 10px;
        line-height: 1.35;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: rgba(255, 248, 250, 0.98);
        background: none;
        border: none;
        border-radius: 0;
        text-shadow:
          0 1px 2px rgba(0, 0, 0, 0.6),
          0 0 14px rgba(0, 0, 0, 0.4);
      }
      #gameView {
        flex: 1 1 auto;
        min-height: 0;
        height: 0;
        position: relative;
        z-index: var(--z-base, 0);
        width: 100%;
      }
      #gameCanvas {
        width: 100%;
        height: 100%;
        min-height: 0;
        display: block;
        background: var(--c-bg-canvas);
      }
      #overlayCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
        z-index: var(--z-overlay);
      }
      .game-intro-wrap {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: var(--z-hud);
        transform: translate(-50%, -50%);
        max-width: 88%;
        width: 100%;
        display: flex;
        justify-content: center;
        box-sizing: border-box;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.28s ease;
      }
      .game-intro-wrap.show {
        opacity: 1;
      }
      .game-intro-card {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 12px;
        max-width: 100%;
        margin: 0;
        padding: 10px 16px 10px 12px;
        text-align: left;
        color: var(--c-ink);
        background: rgba(255, 255, 255, 0.9);
        border-radius: 12px;
        box-shadow: 0 4px 28px rgba(0, 0, 0, 0.18);
      }
      .game-intro-cat {
        flex-shrink: 0;
        width: 56px;
        height: 56px;
        object-fit: contain;
        display: block;
      }
      .game-intro-sub {
        margin: 0;
        flex: 1;
        min-width: 0;
        font-size: 16px;
        line-height: 1.5;
        font-weight: 600;
      }
      .cat-escape-sub {
        position: absolute;
        left: 50%;
        top: 44%;
        z-index: var(--z-hud);
        transform: translate(-50%, -50%);
        max-width: 88%;
        margin: 0;
        padding: 14px 24px;
        text-align: center;
        font-size: 20px;
        line-height: 1.4;
        font-weight: 700;
        color: #5a3540;
        background: rgba(255, 232, 240, 0.94);
        border-radius: 14px;
        box-shadow: 0 6px 32px rgba(80, 40, 60, 0.22);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .cat-escape-sub.show {
        opacity: 1;
      }
      #ui {
        position: fixed;
        inset: 0;
        min-height: 100%;
        min-height: 100dvh;
        pointer-events: none;
        z-index: var(--z-ui);
        background: transparent;
      }
      #ui .panel {
        pointer-events: auto;
      }
      #startPanel,
      #winPanel,
      #cardPanel {
        position: absolute;
        inset: 0;
        min-height: 100%;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top, 0px));
        padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
        background: linear-gradient(180deg, rgba(30, 20, 40, 0.92) 0%, rgba(20, 16, 32, 0.95) 100%);
        text-align: center;
      }
      #winPanel,
      #cardPanel {
        display: none;
      }
      h1 {
        color: #ffb8d0;
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      .sub {
        color: #e8e0f0;
        font-size: 15px;
        line-height: 1.6;
        max-width: 320px;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-block;
        min-width: 200px;
        padding: 14px 24px;
        border: none;
        border-radius: 999px;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        margin: 8px;
        background: linear-gradient(135deg, var(--c-primary-light), var(--c-primary));
        color: var(--c-text-on-dark);
        box-shadow: 0 4px 16px rgba(232, 93, 138, 0.45);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn-ghost {
        background: var(--c-ghost);
        color: #f0e8ff;
        box-shadow: none;
      }
      .btn-narrow {
        min-width: 180px;
      }
      #errorMsg {
        position: fixed;
        left: 0;
        right: 0;
        bottom: env(safe-area-inset-bottom, 16px);
        padding: 12px 16px;
        text-align: center;
        color: #ff9e9e;
        font-size: 14px;
        z-index: var(--z-error);
        display: none;
      }
      #errorMsg.show {
        display: block;
      }
      #gyroBtn {
        font-size: 13px;
        margin-top: 8px;
        padding: 8px 16px;
        display: none;
      }
      #gyroBtn.show {
        display: inline-block;
      }
      #permNote {
        display: none;
        max-width: 300px;
        margin: 0 auto 12px;
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.5;
        color: #ffccc8;
        background: rgba(200, 80, 80, 0.25);
        border-radius: 8px;
        text-align: left;
      }
      #permNote.show {
        display: block;
      }
      #cardPanel {
        overflow-y: auto;
      }
      #cardPanel > * {
        flex-shrink: 0;
      }
      #cardCanvas {
        width: min(90vw, 320px);
        height: auto;
        max-height: max(120px, calc(100dvh - 260px));
        object-fit: contain;
        max-width: 90vw;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      }
      .card-hint {
        margin: 12px 0 0;
        font-size: 12px;
        opacity: 0.75;
      }
      .card-hint-top {
        margin: 0 0 12px;
      }
      .timer-hud {
        max-width: 220px;
        margin: 8px auto 0;
      }
      .timer-hud-eyebrow {
        display: block;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.2em;
        color: rgba(255, 200, 220, 0.72);
        text-align: center;
        margin-bottom: 6px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }
      .timer-bar {
        position: relative;
        height: 7px;
        border-radius: 100px;
        max-width: 100%;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.5) 0%, rgba(30, 20, 40, 0.45) 100%);
        box-shadow:
          inset 0 1px 3px rgba(0, 0, 0, 0.5),
          inset 0 -1px 0 rgba(255, 255, 255, 0.06),
          0 2px 10px rgba(0, 0, 0, 0.2),
          0 0 0 1px rgba(255, 180, 200, 0.12);
      }
      .timer-bar i {
        display: block;
        height: 100%;
        width: 100%;
        border-radius: inherit;
        transform-origin: left center;
        transform: scaleX(1);
        transition: transform 0.14s ease-out;
        will-change: transform;
        background: linear-gradient(
          90deg,
          #4ecdc4 0%,
          #7fd8b8 18%,
          #c5f0a8 36%,
          #ffe66d 55%,
          #ffb3a0 75%,
          #ff6b8a 100%
        );
        background-size: 120% 100%;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.35),
          0 0 14px rgba(120, 230, 200, 0.35);
      }
      @media (prefers-reduced-motion: reduce) {
        .timer-bar i {
          transition: none;
        }
      }
      /* 通关动效：必须保持与 .panel 相同 absolute+inset 铺满屏；勿用 position:relative 否则会塌陷成“半屏” */
      #winPanel {
        position: absolute;
        inset: 0;
        min-height: 100%;
        min-height: 100dvh;
        overflow: hidden;
      }
      #winFxCanvas {
        position: absolute;
        inset: 0;
        z-index: var(--z-base, 0);
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }
      #winPanel::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: var(--z-overlay);
        pointer-events: none;
        background: radial-gradient(
          ellipse 90% 60% at 50% 40%,
          rgba(255, 220, 200, 0.65) 0%,
          rgba(255, 160, 200, 0.2) 45%,
          transparent 68%
        );
        opacity: 0;
      }
      #winPanel.win-burst::after {
        animation: winBurstFlash 0.7s ease-out forwards;
      }
      @keyframes winBurstFlash {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      #winPanel .win-content {
        position: relative;
        z-index: var(--z-hud);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
      }
      @keyframes winHeroIn {
        from {
          opacity: 0;
          transform: scale(0.4) translateY(24px) rotateZ(-3deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes winTitleShine {
        0%,
        100% {
          filter: brightness(1);
        }
        50% {
          filter: brightness(1.15);
        }
      }
      .win-hero {
        transform-origin: center center;
        animation:
          winHeroIn 0.68s cubic-bezier(0.28, 1.15, 0.38, 1) 0.04s both,
          winTitleShine 0.8s ease-in-out 0.2s 2;
      }
      #winTimeText {
        margin-bottom: 6px;
      }
      .win-leaderboard {
        width: 100%;
        max-width: 300px;
        margin: 0 auto 16px;
        padding: 12px 12px 10px;
        background: rgba(0, 0, 0, 0.25);
        border-radius: 12px;
        border: 1px solid rgba(255, 180, 200, 0.18);
      }
      .win-leaderboard-title {
        font-size: 12px;
        color: #d4c4e8;
        margin: 0 0 8px 0;
        text-align: center;
        font-weight: 600;
      }
      .win-leaderboard-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .win-leaderboard-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        line-height: 1.45;
        padding: 6px 6px;
        margin: 0;
        border-radius: 8px;
        color: #ece6f4;
      }
      .win-leaderboard-row:nth-child(even) {
        background: rgba(255, 255, 255, 0.04);
      }
      .win-leaderboard-row.is-you {
        background: rgba(255, 130, 170, 0.16);
        outline: 1px solid rgba(255, 200, 220, 0.35);
      }
      .win-lb-rank {
        flex: 0 0 20px;
        color: #ffd8b0;
        font-weight: 700;
        font-size: 12px;
        text-align: center;
      }
      .win-lb-name {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .win-lb-time {
        flex: 0 0 auto;
        color: #9fe8c8;
        font-weight: 600;
        font-size: 12px;
      }
      .settings-toggle {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: 12px;
        z-index: var(--z-settings);
        width: 42px;
        height: 42px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 50%;
        color: var(--c-text-on-dark);
        background: rgba(20, 15, 28, 0.68);
        font-size: 20px;
        cursor: pointer;
        pointer-events: auto;
      }
      .settings-panel {
        position: fixed;
        top: max(62px, calc(env(safe-area-inset-top) + 50px));
        right: 12px;
        z-index: var(--z-settings-panel);
        width: min(280px, calc(100vw - 24px));
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 16px;
        color: var(--c-text-on-dark);
        background: rgba(25, 18, 32, 0.94);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
        pointer-events: auto;
      }
      .settings-panel h2 {
        margin: 0 0 10px;
        font-size: 18px;
      }
      .setting-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        padding: 10px 0;
        font-size: 14px;
      }
      .setting-row input {
        width: 22px;
        height: 22px;
        accent-color: var(--c-accent);
      }
      .simulated-note {
        font-size: 10px;
        opacity: 0.72;
        font-weight: 400;
      }
      .reduce-motion *,
      .reduce-motion *::before,
      .reduce-motion *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="hud" aria-live="polite">
        <p id="titleLine">转动手机，找到躲起来的小猫</p>
        <p id="statsLine" class="hud-stats"></p>
        <div class="timer-hud is-hidden" id="timerWrap" aria-label="本回合时间">
          <span class="timer-hud-eyebrow" aria-hidden="true">本回合</span>
          <div class="timer-bar"><i id="timerFill"></i></div>
        </div>
        <div
          id="catchTimeHud"
          class="catch-time-hud is-hidden"
          aria-live="polite"
          aria-atomic="true"
          aria-label="各次抓猫耗时"
        ></div>
      </div>
      <div id="gameView">
        <canvas id="gameCanvas" aria-label="游戏画面 全景"></canvas>
        <canvas id="overlayCanvas" aria-hidden="true"></canvas>
        <div
          id="gameIntroSubWrap"
          class="game-intro-wrap is-hidden"
          aria-hidden="true"
          role="status"
          data-intro-text="帮我找到猫猫，抓到可能也会跑哦"
        >
          <div class="game-intro-card">
            <img
              class="game-intro-cat"
              src="./images/猫腰.png"
              width="64"
              height="64"
              alt=""
              draggable="false"
              aria-hidden="true"
            />
            <p id="gameIntroSub" class="game-intro-sub"></p>
          </div>
        </div>
        <p id="catEscapeSub" class="cat-escape-sub is-hidden" aria-hidden="true" role="status"></p>
      </div>
    </div>
    <div id="ui">
      <button
        id="btnSettings"
        class="settings-toggle"
        type="button"
        aria-label="游戏设置"
        aria-expanded="false"
      >
        ⚙
      </button>
      <section id="settingsPanel" class="settings-panel" aria-label="游戏设置" hidden>
        <h2>游戏设置</h2>
        <label class="setting-row"
          ><span>声音</span><input id="settingSound" type="checkbox"
        /></label>
        <label class="setting-row"
          ><span>陀螺仪</span><input id="settingGyro" type="checkbox"
        /></label>
        <label class="setting-row"
          ><span>减少动态效果</span><input id="settingMotion" type="checkbox"
        /></label>
      </section>
      <div id="startPanel" class="panel">
        <h1>寻喵大作战</h1>
        <p class="sub">360° 全景图。陀螺仪或拖动，上下左右环顾。点击伸手去揪～</p>
        <p class="sub" id="permNote" role="note">
          你当前是「非 HTTPS」或旧版
          WebView：系统往往<strong>不会</strong>弹出陀螺仪/动作权限，也没有「发请求」的提示。请用
          <strong>https</strong> 打开（如部署带证书、或本机
          <code>https://localhost</code> 测试），并尽量用 <strong>系统 Safari</strong>。
        </p>
        <button type="button" class="btn" id="btnStart">开找</button>
        <button type="button" class="btn btn-ghost gyroBtn" id="gyroBtn">补开：陀螺仪转视角</button>
      </div>
      <div id="winPanel" class="panel">
        <canvas id="winFxCanvas" width="1" height="1" aria-hidden="true"></canvas>
        <div class="win-content">
          <h1 class="win-hero">通关啦！</h1>
          <p
            class="sub"
            id="winTimeText"
            data-time-template="总用时 {sec} 秒。猫猫终于投入你的怀抱啦。"
          ></p>
          <div class="win-leaderboard" aria-label="本局成绩榜">
            <p class="win-leaderboard-title">
              模拟榜单 <span class="simulated-note">（演示数据，非在线排名）</span>
            </p>
            <ul id="winLeaderboardList" class="win-leaderboard-list"></ul>
          </div>
          <button type="button" class="btn" id="btnCard">生成战绩卡片</button>
          <button type="button" class="btn btn-ghost" id="btnAgain">再抓一次</button>
        </div>
      </div>
      <div id="cardPanel" class="panel">
        <p class="sub card-hint-top">长按图片保存，再到抖音发布哦</p>
        <canvas id="cardCanvas" width="720" height="1280" aria-label="战绩卡片"></canvas>
        <p class="card-hint">也可点下方保存到相册，再到抖音发图文</p>
        <button type="button" class="btn btn-narrow" id="btnSaveCard">保存图片到相册</button>
        <button type="button" class="btn btn-ghost" id="btnBackWin">返回</button>
      </div>
    </div>
    <p id="errorMsg" role="alert"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
